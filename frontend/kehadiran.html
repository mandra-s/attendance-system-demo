<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Riwayat Kehadiran</title>
  <link rel="stylesheet" href="style.css" />
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="icon" href="assets/itenasicon.png" />
  <!-- face-api CDN (opsional, hapus jika sudah dimuat di proyekmu) -->
  <script defer src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js"></script>
</head>
<body>
  <div class="app">
    <!-- SIDEBAR -->
    <aside id="sidebar" class="sidebar">
      <button id="closeSidebar" class="sidebar-close" aria-label="Tutup sidebar">X</button>
      <div class="sidebar-top">
        <div class="brand">
          <img src="assets/itenasicon.png" alt="logo" class="brand-logo" />
          <span class="brand-text">Presensi ITENAS</span>
        </div>
      </div>

      <div class="profile">
        <img id="profilePhoto" src="" alt="Profil" class="profile-pic" />
        <div class="profile-info">
          <div id="profileName" class="profile-name">Nama Mahasiswa</div>
          <div id="profileRole" class="profile-role">Prodi / NIM</div>
        </div>
      </div>

      <nav class="menu">
        <a href="dashboard.html" class="menu-item">
          <i data-lucide='Scan' class="lucide-icon"></i><span>Scan Wajah</span></a>
        <a href="pendaftaran.html" class="menu-item">
          <i data-lucide='clipboard-list' class="lucide-icon"></i><span>Pendaftaran</span></a>
        <a href="kehadiran.html" class="menu-item active">
          <i data-lucide='user-check' class="lucide-icon"></i><span>Kehadiran</span></a>
        <a href="jadwal-kuliah" class="menu-item">
          <i data-lucide='calendar' class="lucide-icon"></i><span>Jadwal Kuliah</span></a>
        <a href="jadwal-ujian" class="menu-item">
          <i data-lucide='calendar' class="lucide-icon"></i><span>Jadwal Ujian</span></a>
        <a href="kuesioner.html" class="menu-item">
          <i data-lucide='file-text' class="lucide-icon"></i><span>Kuesioner</span></a>
        </nav>
      <div class="sidebar-footer">
        <a href="#" class="menu-item">
          <i data-lucide='log-out' class="lucide-icon"></i><span>Keluar</span></a>
      </div>    
    </aside>

    <!-- MAIN -->
    <div class="main">
        <header class="topbar">
          <button id="toggleSidebar" class="toggle-btn" aria-label="Toggle sidebar">☰</button>
          <h1 class="topbar-title">Kehadiran</h1>
        </header>

        <main>
            <section class="attendance-section bg-gray-50 p-6 fade">
              <div class="max-w-4xl mx-auto bg-white rounded-2xl shadow-lg p-6">
                <h1 class="text-2xl font-bold text-center mb-4">Riwayat Kehadiran Saya</h1>
            
                <table class="w-full border rounded-lg text-sm">
                  <thead class="bg-gray-100">
                    <tr>
                      <th class="py-2 px-3 text-left">No</th>
                      <th class="py-2 px-3 text-left">Nama</th>
                      <th class="py-2 px-3 text-left">Tanggal</th>
                      <th class="py-2 px-3 text-left">Jam</th>
                      <th class="py-2 px-3 text-left">Status</th>
                    </tr>
                  </thead>
                  <tbody id="attendanceList" class="divide-y">
                    <!-- Data dummy sementara -->
                    <tr class="hover:bg-orange-50 transition">
                      <td class="py-2 px-3">1</td>
                      <td class="py-2 px-3">Nama Pengguna</td>
                      <td class="py-2 px-3">2025-11-08</td>
                      <td class="py-2 px-3">08:30</td>
                      <td class="py-2 px-3"><span class="text-green-600 font-semibold">Hadir</span></td>
                    </tr>
                    <tr class="hover:bg-orange-50 transition">
                      <td class="py-2 px-3">2</td>
                      <td class="py-2 px-3">Nama Pengguna</td>
                      <td class="py-2 px-3">2025-11-07</td>
                      <td class="py-2 px-3">08:32</td>
                      <td class="py-2 px-3"><span class="text-green-600 font-semibold">Hadir</span></td>
                    </tr>
                  </tbody>
                </table>
              </div>
            </section>
        </main>
    </div>          
  <script src="face-utils.js"></script>
</body>
</html>
